name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            -t ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }} \
            -t ${{ steps.version.outputs.image }}:latest \
            .

      - name: Push
        run: |
          docker push ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          docker push ${{ steps.version.outputs.image }}:latest

  deploy-staging:
    needs: build
    runs-on: self-hosted

    environment:
      name: staging

    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy staging
        run: |
          docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

          docker stop mlops-api-staging || true
          docker rm mlops-api-staging || true

          docker run -d \
            --name mlops-api-staging \
            --restart unless-stopped \
            -p 5000:5000 \
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:5000/health

  deploy-production:
    needs:
      - build
      - deploy-staging

    runs-on: self-hosted

    environment:
      name: production

    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy production
        run: |
          docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

          docker stop mlops-api-prod || true
          docker rm mlops-api-prod || true

          docker run -d \
            --name mlops-api-prod \
            --restart unless-stopped \
            -p 5001:5000 \
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Verify production
        run: |
          sleep 5
          curl --fail http://localhost:5001/health
